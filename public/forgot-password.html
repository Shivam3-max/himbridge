<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — Himbridge Global Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="icon" href="/assets/favicon.svg">
<script>try{if((localStorage.getItem("hbg-lang")||"en")!=="en"){document.documentElement.style.visibility="hidden";setTimeout(function(){document.documentElement.style.visibility=""},2500)}}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="pagebar"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> › <a href="/login">Login</a> › Forgot password</div>
  <h1>Forgot Password</h1>
  <p>Enter your registered email. We will send you a secure link to choose a new password.</p>
</div></div>
<div class="wrap section" style="max-width:560px">
  <form class="block" id="f" novalidate>
    <div class="block-head saffron"><h3>Request a reset link</h3></div>
    <div class="block-body">
      <div class="form-msg" id="msg"></div>
      <div class="field"><label for="email">Registered email <span class="req">*</span></label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <button class="btn">Send reset link</button>
      <span class="small muted" style="margin-left:10px"><a href="/login">Back to login</a></span>
      <p class="tiny muted" style="margin-top:14px">The link is valid for 1 hour. If you don't see the email, check your spam folder or contact the help desk.</p>
    </div>
  </form>
</div>
</main>
<div id="site-footer"></div>
<script type="module">
import { api, formData, showMsg, qs } from '/assets/app.js';
const f = qs('#f');
f.onsubmit = async (e) => {
  e.preventDefault();
  const d = formData(f);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email || '')) return showMsg(qs('#msg'), 'Enter a valid email address.');
  try { await api('/api/password/forgot', { body: d }); showMsg(qs('#msg'), 'If an account exists for this email, a reset link is on its way.', true); f.reset(); }
  catch (err) { showMsg(qs('#msg'), err.message); }
};
</script>
</body>
</html>
