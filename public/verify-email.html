<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Email — Himbridge Global Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="icon" href="/assets/favicon.svg">
<script>try{if((localStorage.getItem("hbg-lang")||"en")!=="en"){document.documentElement.style.visibility="hidden";setTimeout(function(){document.documentElement.style.visibility=""},2500)}}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="pagebar"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> › Email verification</div>
  <h1>Email Verification</h1>
</div></div>
<div class="wrap section" style="max-width:560px">
  <div class="block"><div class="block-head green"><h3>Confirming your email</h3></div>
    <div class="block-body" id="out"><div class="empty">Checking your link…</div></div></div>
</div>
</main>
<div id="site-footer"></div>
<script type="module">
import { api, esc, qs } from '/assets/app.js';
const token = new URLSearchParams(location.search).get('token');
try {
  if (!token) throw new Error('This page needs the link from your verification email.');
  await api('/api/email/verify', { body: { token } });
  qs('#out').innerHTML = '<div class="form-msg show ok">Thank you — your email address is confirmed.</div><a class="btn" href="/dashboard">Open my dashboard</a>';
} catch (err) {
  qs('#out').innerHTML = `<div class="form-msg show err">${esc(err.message)}</div><p class="small">Log in and use <b>Resend verification email</b> on your dashboard to get a fresh link.</p><a class="btn ghost" href="/login">Login</a>`;
}
</script>
</body>
</html>
