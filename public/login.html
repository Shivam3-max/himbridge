<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Himbridge Global Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="icon" href="/assets/favicon.svg">
<script>try{if((localStorage.getItem("hbg-lang")||"en")!=="en"){document.documentElement.style.visibility="hidden";setTimeout(function(){document.documentElement.style.visibility=""},2500)}}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="pagebar"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> › Login</div>
  <h1>Portal Login</h1>
  <p>One login for buyers, manufacturers, logistics partners and Himbridge staff.</p>
</div></div>
<div class="wrap auth">
  <div class="block">
    <div class="block-head saffron"><h3>Sign in to your account</h3></div>
    <form class="block-body" id="f" novalidate>
      <div class="form-msg" id="msg"></div>
      <div class="field"><label for="email">Registered email <span class="req">*</span></label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password <span class="req">*</span></label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="btn">Login</button>
        <span class="small"><a href="/forgot-password">Forgot password?</a></span>
      </div>
      <p class="small muted" style="margin-top:16px">New to Himbridge? <a href="/register"><b>Create an account</b></a></p>
    </form>
  </div>
  <div class="grid" style="align-content:start">
    <div id="side-img"></div>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script type="module">
import { api, formData, showMsg, qs, ph, PEAK } from '/assets/app.js';
qs('#side-img').innerHTML = `<div class="side-banner"><img src="/assets/img/login-warehouse.jpg" alt="" loading="lazy"><div><span class="kicker">${PEAK}Secure portal</span><p>One login for buyers, makers and logistics partners.</p></div></div>`;
const f = qs('#f');
const next = new URLSearchParams(location.search).get('next');
const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard';
f.onsubmit = async (e) => {
  e.preventDefault();
  const d = formData(f);
  if (!d.email || !d.password) return showMsg(qs('#msg'), 'Enter your email and password.');
  try { await api('/api/login', { body: d }); location.href = safeNext; }
  catch (err) { showMsg(qs('#msg'), err.message); }
};
</script>
</body>
</html>
