<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Document — Himbridge Global Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.svg">
<style>
  :root { --navy: #0b2a5b; --saffron: #f08a00; --ink: #18202f; --muted: #5a6b82; --line: #d5dce7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f6; color: var(--ink); font: 13px/1.5 'Noto Sans', Arial, sans-serif; }
  .bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar button, .bar a { font: 600 13px 'Noto Sans', sans-serif; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; text-decoration: none; }
  .bar a { background: #fff; color: var(--navy); }
  .sheet { width: min(210mm, 100% - 32px); margin: 20px auto 40px; background: #fff; padding: 14mm 14mm 12mm; box-shadow: 0 2px 14px rgba(11,42,91,.12); }
  .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; border-bottom: 3px solid var(--navy); padding-bottom: 10px; }
  .brand { display: flex; gap: 10px; align-items: center; }
  .brand svg { width: 46px; height: 46px; }
  .brand b { display: block; font: 700 20px 'Noto Serif', Georgia, serif; letter-spacing: .08em; color: var(--navy); }
  .brand span { font-size: 9.5px; letter-spacing: .24em; color: var(--saffron); font-weight: 700; }
  .doc-title { text-align: right; }
  .doc-title h1 { margin: 0; font: 700 18px 'Noto Serif', Georgia, serif; color: var(--navy); text-transform: uppercase; letter-spacing: .04em; }
  .doc-title div { color: var(--muted); font-size: 12px; }
  .parties { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); margin: 14px 0; }
  .parties > div { padding: 8px 10px; border-right: 1px solid var(--line); }
  .parties > div:last-child { border-right: 0; }
  h4 { margin: 0 0 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f3f6fa; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
  .r { text-align: right; white-space: nowrap; }
  .terms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
  .terms div { border: 1px solid var(--line); margin: -1px 0 0 -1px; padding: 6px 8px; }
  .totals { margin-left: auto; width: 46%; margin-top: -1px; }
  .totals td:first-child { color: var(--muted); }
  .totals tr:last-child td { font-weight: 800; color: var(--navy); background: #f3f6fa; }
  .foot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 18px; font-size: 11.5px; }
  .sign { border-top: 1px solid var(--ink); margin-top: 46px; padding-top: 4px; text-align: center; color: var(--muted); }
  .note { margin-top: 16px; font-size: 10.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
  .err { max-width: 560px; margin: 60px auto; background: #fff; padding: 24px; border-left: 4px solid #c8102e; }
  @media (max-width: 640px) { .parties, .terms, .foot { grid-template-columns: minmax(0, 1fr); } .parties > div { border-right: 0; border-bottom: 1px solid var(--line); } .totals { width: 100%; } .sheet { padding: 16px; } .head { flex-direction: column; } .doc-title { text-align: left; } .tbl-wrap { overflow-x: auto; } }
  @media print { body { background: #fff; } .bar { display: none; } .sheet { width: auto; margin: 0; padding: 0; box-shadow: none; } @page { size: A4; margin: 12mm; } }
</style>
<script>try{if((localStorage.getItem("hbg-lang")||"en")!=="en"){document.documentElement.style.visibility="hidden";setTimeout(function(){document.documentElement.style.visibility=""},2500)}}catch(e){}</script>
</head>
<body>
<div class="bar"><button onclick="print()">Print / Save as PDF</button><a href="/dashboard#orders">Back to dashboard</a></div>
<main id="doc"><div class="err">Loading document…</div></main>
<script type="module">
import { api, esc, usd, fmtNum, fmtDate, tr } from '/assets/app.js';
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b2a5b"/><path d="M13 13.5 Q13 12 14.5 12 H20.5 Q22 12 22 13.5 V52 H13 Z" fill="#fff"/><path d="M42 13.5 Q42 12 43.5 12 H49.5 Q51 12 51 13.5 V52 H42 Z" fill="#fff"/><path d="M22 35 L32 16 L42 35 Z" fill="#f08a00"/><path d="M32 16 L27.3 24.9 L29.8 23.4 L32 25.4 L34.3 23.4 L36.7 24.9 Z" fill="#fff"/><rect x="13" y="35" width="38" height="5.5" fill="#fff"/><path d="M22 52 Q32 42.5 42 52" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const TYPES = { proforma: 'Proforma Invoice', commercial: 'Commercial Invoice', packing: 'Packing List' };
const q = new URLSearchParams(location.search), type = TYPES[q.get('type')] ? q.get('type') : 'proforma';
try {
  const o = await api(`/api/orders/${encodeURIComponent(q.get('order') || '')}/document`);
  document.title = `${tr(TYPES[type])} ${o.code} — Himbridge`;
  const no = `${type === 'proforma' ? 'PI' : type === 'commercial' ? 'CI' : 'PL'}-${o.code}`;
  const origin = o.vendor_origin === 'IN' ? 'India' : o.vendor_origin === 'CN' ? 'China' : (o.vendor_country || '—');
  const adv = o.payments.find((p) => p.stage === 'advance'), bal = o.payments.find((p) => p.stage === 'balance');
  const party = (h, name, lines) => `<div><h4>${h}</h4><b>${esc(name)}</b><br>${lines.filter(Boolean).map(esc).join('<br>')}</div>`;
  const items = type === 'packing'
    ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Description of goods</th><th>HS code</th><th class="r">Quantity</th><th class="r">Cartons</th><th class="r">Net wt (kg)</th><th class="r">Gross wt (kg)</th><th class="r">CBM</th></tr></thead>
       <tbody><tr><td>1</td><td><b>${esc(o.title)}</b>${o.details ? `<br><span style="color:var(--muted)">${esc(o.details)}</span>` : ''}</td><td>${esc(o.hs)}</td><td class="r">${fmtNum(o.quantity)} ${esc(o.unit || '')}</td><td class="r">________</td><td class="r">________</td><td class="r">________</td><td class="r">______</td></tr></tbody></table></div>
       <p style="color:var(--muted);font-size:11px">Carton count, weights and volume are completed by the manufacturer at packing and verified at pre-shipment inspection.</p>`
    : `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Description of goods</th><th>HS code</th><th class="r">Quantity</th><th class="r">Unit price (USD)</th><th class="r">Amount (USD)</th></tr></thead>
       <tbody><tr><td>1</td><td><b>${esc(o.title)}</b>${o.details ? `<br><span style="color:var(--muted)">${esc(o.details)}</span>` : ''}</td><td>${esc(o.hs)}</td><td class="r">${fmtNum(o.quantity)} ${esc(o.unit || '')}</td><td class="r">${usd(o.unit_price)}</td><td class="r">${usd(o.total)}</td></tr></tbody></table></div>
       <table class="totals"><tr><td>Sub-total (${esc(o.incoterm)})</td><td class="r">${usd(o.total)}</td></tr>
       ${type === 'proforma' ? `<tr><td>Advance ${adv?.pct ?? 30}% — due on confirmation</td><td class="r">${usd(adv?.amount)}</td></tr><tr><td>Balance ${bal?.pct ?? 70}% — due after QC</td><td class="r">${usd(bal?.amount)}</td></tr>` : ''}
       <tr><td>Total amount (USD)</td><td class="r">${usd(o.total)}</td></tr></table>`;
  document.querySelector('#doc').innerHTML = `<article class="sheet">
    <div class="head"><div class="brand">${LOGO}<div><b>HIMBRIDGE</b><span>GLOBAL TRADE PORTAL</span></div></div>
      <div class="doc-title"><h1>${TYPES[type]}</h1><div>No. <b>${esc(no)}</b></div><div>Date ${fmtDate(new Date().toISOString().slice(0, 19).replace('T', ' '))}</div><div><span>Order</span> ${esc(o.code)} · <span>Placed on</span> <span>${fmtDate(o.created_at)}</span></div></div></div>
    <div class="parties">
      ${party('Seller / manufacturer', o.vendor_company, [o.vendor_cluster, o.vendor_country])}
      ${party('Buyer / consignee', o.buyer_company, [o.buyer_name, o.buyer_country, o.buyer_email, o.buyer_phone])}
      ${party('Trade facilitator', 'Himbridge Global Trade Portal', ['helpdesk@himbridge.trade', 'Escrow & milestone payments'])}
    </div>
    <div class="terms">
      <div><h4>Incoterm</h4>${esc(o.incoterm || 'FOB')}</div><div><h4>Country of origin</h4>${esc(origin)}</div>
      <div><h4>Port of loading</h4>${esc(o.origin_port || 'To be confirmed')}</div><div><h4>Port of discharge</h4>${esc(o.dest_port || o.destination || '—')}</div>
      <div><h4>Mode</h4>${esc(o.mode || 'To be confirmed')}</div><div><h4>Lead time</h4>${o.lead_days ? o.lead_days + ' days' : '—'}</div>
      <div><h4>Currency</h4>USD</div><div><h4>Status</h4>${esc(o.status.replace('_', ' '))}</div>
    </div>
    ${items}
    <div class="foot"><div><h4>${type === 'packing' ? 'Marks & numbers' : 'Payment terms & bank'}</h4>${type === 'packing' ? `Shipping marks: ${esc(o.code)} / ${esc(o.buyer_company)} / ${esc(o.dest_port || o.destination || '')}<br>Made in ${esc(origin)}` : `${adv?.pct ?? 30}% advance against this proforma, ${bal?.pct ?? 70}% balance after the pre-shipment QC report is shared. Funds are paid to the Himbridge collection account and released to the seller at each milestone.<br><br>Bank details are shared on the official proforma issued by the Himbridge accounts desk.`}</div>
      <div><div class="sign"><span>Authorised signatory</span> · ${esc(o.vendor_company)}</div></div></div>
    <p class="note">${type === 'proforma' ? 'This proforma invoice is issued for advance payment and import licensing purposes. Prices are valid for the agreed lead time.' : 'We certify that this invoice shows the actual price of the goods described and that all particulars are true and correct.'} Generated on the Himbridge Global Trade Portal. Verify current duties and compliance requirements for the destination market.</p>
  </article>`;
} catch (err) {
  document.querySelector('#doc').innerHTML = `<div class="err"><b>Document unavailable.</b><br>${esc(err.message)}. <a href="/login?next=${encodeURIComponent(location.pathname + location.search)}">Log in</a> with an account that is part of this order.</div>`;
}
</script>
</body>
</html>
