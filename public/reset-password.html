<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Himbridge Global Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="icon" href="/assets/favicon.svg">
<script>try{if((localStorage.getItem("hbg-lang")||"en")!=="en"){document.documentElement.style.visibility="hidden";setTimeout(function(){document.documentElement.style.visibility=""},2500)}}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="pagebar"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> › <a href="/login">Login</a> › Reset password</div>
  <h1>Choose a New Password</h1>
  <p>For your security, all other sessions are signed out after the change.</p>
</div></div>
<div class="wrap section" style="max-width:560px">
  <form class="block" id="f" novalidate>
    <div class="block-head saffron"><h3>New password</h3></div>
    <div class="block-body">
      <div class="form-msg" id="msg"></div>
      <div class="field"><label for="pw">New password <span class="req">*</span> <span class="tiny muted">(min 8 characters)</span></label><input id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="pw2">Confirm new password <span class="req">*</span></label><input id="pw2" name="confirm" type="password" autocomplete="new-password" required></div>
      <button class="btn">Save password</button>
    </div>
  </form>
</div>
</main>
<div id="site-footer"></div>
<script type="module">
import { api, formData, showMsg, qs } from '/assets/app.js';
const f = qs('#f'), token = new URLSearchParams(location.search).get('token');
if (!token) showMsg(qs('#msg'), 'This page needs the link from your reset email. Request a new one from "Forgot password".');
f.onsubmit = async (e) => {
  e.preventDefault();
  const d = formData(f);
  if ((d.password || '').length < 8) return showMsg(qs('#msg'), 'Password must be at least 8 characters.');
  if (d.password !== d.confirm) return showMsg(qs('#msg'), 'The two passwords do not match.');
  try {
    await api('/api/password/reset', { body: { token, password: d.password } });
    f.querySelector('.block-body').innerHTML = '<div class="form-msg show ok">Password updated. You can now log in with your new password.</div><a class="btn" href="/login">Go to login</a>';
  } catch (err) { showMsg(qs('#msg'), err.message + (err.message.includes('expired') ? ' ' : ''));
    qs('#msg').insertAdjacentHTML('beforeend', ' <a href="/forgot-password">Request a new link</a>'); }
};
</script>
</body>
</html>
