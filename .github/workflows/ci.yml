name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: himbridge
          POSTGRES_USER: himbridge
          POSTGRES_PASSWORD: himbridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U himbridge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://himbridge:himbridge@localhost:5432/himbridge
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters-long
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Migrations apply cleanly
        run: |
          npm run db:migrate
          npx drizzle-kit check
      - run: npm run db:seed
      - run: npm run i18n:check -- --strict
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t himbridge:ci .
