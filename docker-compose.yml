# ─────────────────────────────────────────────────────────────
# Production stack for a single server (VPS):
#   caddy  → HTTPS for your domain (free Let's Encrypt certificate, auto-renewed)
#   app    → the Next.js portal
#   db     → PostgreSQL 17 (data in the "pgdata" volume)
#   migrate→ applies database migrations, then exits (runs before the app starts)
#
# Setup:  cp .env.production.example .env.production  → fill it in  →
#         docker compose --env-file .env.production up -d --build
# See docs/DEPLOYMENT.md for the full guide.
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: himbridge
      POSTGRES_USER: himbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U himbridge -d himbridge']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://himbridge:${POSTGRES_PASSWORD}@db:5432/himbridge
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://himbridge:${POSTGRES_PASSWORD}@db:5432/himbridge
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
